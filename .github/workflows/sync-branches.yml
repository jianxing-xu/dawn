name: SyncStoreBranches

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'config/settings_data.json'
      - 'templates/*.json'
      - 'templates/gift_card.liquid'
      - 'sections/*-group.json'
      - 'assets/uno.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store: [de, us]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        # For Build UnoCSS START
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        # For Build UnoCSS END

      - name: Sync to store branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          # 确定目标分支
          if [ "$SOURCE_BRANCH" = "main" ]; then
            TARGET_BRANCH="${{ matrix.store }}-main"
          else
            TARGET_BRANCH="${{ matrix.store }}-staging"
          fi

          echo "Syncing $SOURCE_BRANCH -> $TARGET_BRANCH"

          # 检出或创建目标分支
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH"
          fi

          # 合并代码变更，但始终保留商店特定配置文件
          # 1. 先执行不自动提交的合并
          git merge "origin/$SOURCE_BRANCH" \
            --no-ff \
            --no-commit \
            || true

          # 2. 无论是否有冲突，强制还原目标分支上的配置文件版本
          #    HEAD 指向合并前的目标分支提交
          git restore --source=HEAD -- config/settings_data.json || true
          git restore --source=HEAD -- templates/*.json || true
          git restore --source=HEAD -- templates/gift_card.liquid || true
          git restore --source=HEAD -- sections/*-group.json || true

          # 3. 基于合并后的代码生成 UnoCSS
          yarn build:uno

          # 4. 重新暂存所有更改并提交合并（包含 assets/uno.css）
          git add .

          # 如果合并后确实有变更，则创建合并提交；否则跳过提交
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync code from $SOURCE_BRANCH [skip deploy]"
          else
            echo "No code changes to sync from $SOURCE_BRANCH to $TARGET_BRANCH"
          fi

          # 推送到 GitHub（包含 assets/uno.css）
          git push origin "$TARGET_BRANCH"
