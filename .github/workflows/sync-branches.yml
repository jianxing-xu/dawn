name: Sync Store Branches (Code Only)

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'config/settings_data.json'
      - 'templates/*.json'
      - 'sections/*-group.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store: [de, us]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to store branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          
          # 确定目标分支
          if [ "$SOURCE_BRANCH" = "main" ]; then
            TARGET_BRANCH="${{ matrix.store }}-main"
          else
            TARGET_BRANCH="${{ matrix.store }}-staging"
          fi
          
          echo "Syncing $SOURCE_BRANCH -> $TARGET_BRANCH"
          
          # 检出或创建目标分支
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH"
          fi
          
          # 合并代码变更，保护商店特定文件
          git merge "origin/$SOURCE_BRANCH" \
            --no-ff \
            -X ours \
            -m "chore: sync code from $SOURCE_BRANCH [skip deploy]" \
            || {
              # 自动解决冲突
              git checkout --ours config/settings_data.json || true
              git checkout --ours templates/*.json || true
              git checkout --ours sections/*.json || true
              git add .
              git commit -m "chore: auto-resolve conflicts"
            }
          
          # 推送到 GitHub
          git push origin "$TARGET_BRANCH"