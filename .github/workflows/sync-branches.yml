name: SyncStoreBranches

on:
  push:
    branches:
      - main
      - staging
      - test
    paths-ignore:
      - 'config/markets.json'
      - 'config/settings_data.json'
      - 'templates/*.json'
      - 'templates/gift_card.liquid'
      - 'sections/*-group.json'
      - 'assets/uno.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # build_uno_css:
