name: Sync Store Branches (Code Only)

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'config/settings_data.json'
      - 'templates/*.json'
      - 'sections/*-group.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store: [de, us]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to store branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          
          # 确定目标分支
          if [ "$SOURCE_BRANCH" = "main" ]; then
            TARGET_BRANCH="${{ matrix.store }}-main"
          else
            TARGET_BRANCH="${{ matrix.store }}-staging"
          fi
          
          echo "Syncing $SOURCE_BRANCH -> $TARGET_BRANCH"
          
          # 检出或创建目标分支
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH"
          fi
          
          # 合并代码变更，但始终保留商店特定配置文件
          # 1. 先执行不自动提交的合并
          git merge "origin/$SOURCE_BRANCH" \
            --no-ff \
            --no-commit \
            || true
          
          # 2. 无论是否有冲突，强制还原目标分支上的配置文件版本
          #    HEAD 指向合并前的目标分支提交
          git checkout HEAD -- config/settings_data.json || true
          git checkout HEAD -- templates/*.json || true
          git checkout HEAD -- sections/*-group.json || true
          
          # 3. 重新暂存所有更改并提交合并
          git add .
          
          # 如果合并后确实有变更，则创建合并提交；否则跳过提交
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync code from $SOURCE_BRANCH [skip deploy]"
          else
            echo "No code changes to sync from $SOURCE_BRANCH to $TARGET_BRANCH"
          fi
          
          # 推送到 GitHub
          git push origin "$TARGET_BRANCH"